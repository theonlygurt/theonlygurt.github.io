<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Only Gurt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 2px solid #58a6ff;
            margin-bottom: 16px;
        }

        h1 {
            color: #f0f6fc;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 12px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
            color: #58a6ff;
        }

        .divider {
            border: 0;
            height: 1px;
            background: #30363d;
            margin: 24px 0 20px 0;
        }

        .about-section {
            text-align: left;
        }

        .about-title {
            color: #f0f6fc;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .about-text {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.6;
            text-indent: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://github.com/theonlygurt.png" alt="Avatar" class="avatar">
        <h1>Welcome to Gurt's Space</h1>
        <p class="subtitle">Personal website and stuff</p>

        <div class="links">
            <a href="https://github.com/theonlygurt" class="btn" target="_blank">GitHub Profile</a>
            <a href="README.md" class="btn">README</a>
            <a href="https://x.com/gurtygur?s=11" class="btn" target="_blank">X contact</a>
            <a href="https://discord.com/users/917762961240621067" class="btn" target="_blank">Discord contact</a>
        </div>

        <hr class="divider">

        <div class="about-section">
            <h2 class="about-title">Abouts</h2>
            <p class="about-text">Hello, I am Gurt! I am a 15 years old student who learns about coding in Rust, Javascript and HTML!</p>
        </div>
    </div>

</body>
</html>
