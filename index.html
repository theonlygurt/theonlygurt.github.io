<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Only Gurt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #58a6ff;
            margin-bottom: 12px;
        }

        h1 {
            color: #f0f6fc;
            font-size: 1.35rem;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: block;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
            color: #58a6ff;
        }

        .divider {
            border: 0;
            height: 1px;
            background: #30363d;
            margin: 16px 0;
        }

        .about-section {
            text-align: left;
            margin-bottom: 16px;
        }

        .about-title {
            color: #f0f6fc;
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .about-text {
            color: #8b949e;
            font-size: 0.9rem;
            line-height: 1.5;
            text-indent: 16px;
        }

        /* Hộp kỹ năng chứa icon đã tách nền */
        .skills-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .skill-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .skill-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        /* Đổi màu logo Rust sang trắng cho nổi bật trên nền tối */
        .rust-icon {
            filter: invert(1);
        }

        .skill-name {
            color: #8b949e;
            font-size: 0.8rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://github.com/theonlygurt.png" alt="Avatar" class="avatar">
        <h1>Welcome to Gurt's Space</h1>
        <p class="subtitle">Personal website and stuff</p>

        <div class="links">
            <a href="https://github.com/theonlygurt" class="btn" target="_blank">GitHub Profile</a>
            <a href="README.md" class="btn">README</a>
            <a href="https://x.com/gurtygur?s=11" class="btn" target="_blank">X contact</a>
            <a href="https://discord.com/users/917762961240621067" class="btn" target="_blank">Discord contact</a>
        </div>

        <hr class="divider">

        <div class="about-section">
            <h2 class="about-title">Abouts</h2>
            <p class="about-text">Hello, I am Gurt! I am a 15 years old student who learns about coding in Rust, Javascript and HTML!</p>
        </div>

        <!-- Hộp icon kỹ năng đã tách nền sẵn -->
        <div class="skills-box">
            <div class="skill-item">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/rust/rust-plain.svg" alt="Rust" class="skill-icon rust-icon">
                <span class="skill-name">Rust</span>
            </div>
            <div class="skill-item">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" alt="JavaScript" class="skill-icon">
                <span class="skill-name">JavaScript</span>
            </div>
            <div class="skill-item">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" alt="HTML" class="skill-icon">
                <span class="skill-name">HTML</span>
            </div>
        </div>
    </div>

</body>
</html>
